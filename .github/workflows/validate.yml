name: Validate skills and installer

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: '发布准备阶段固定的提交 SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.14.0'
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate budgets, packages, materials and behavior
        run: npm run check:full
      - name: Replay captured statechart results
        run: npm run check:statechart
      - name: Install and verify the actual npm tarball
        run: npm run check:package
