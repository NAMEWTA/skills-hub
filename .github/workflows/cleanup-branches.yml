name: Remove merged temporary branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Branch-Cleanup: confirmed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify project before deleting branches
        run: npm run check:full
      - name: Clean only branches fully included in main
        run: node scripts/cleanup-merged-branches.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
