# 非秘密配置示例。复制到项目资料目录再填写；此文件不会自动创建或启用任务。
# schema_version 只表示此配置格式版本，不是工作流状态机。所有动作名称与模型必须来自实际能力。
schema_version: 1

automations:
  triage_name: "issue-triage"
  reproduce_name: "issue-reproduce"

slack:
  source_channel_id: "SOURCE_CHANNEL_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  read_action: "配置的-slack-读取动作"
  thread_post_action: "配置的-slack-讨论串发帖动作"
  file_download_action: "配置的-slack-文件下载动作"
  operations_edit_action: "配置的-slack-编辑动作"
  prefer_configured_actions: true
  optional_bot_token_env: "ISSUE_SLACK_BOT_TOKEN"
  allow_source_root_posts: false
  allow_worker_slack_writes: false

repository:
  url: "REPOSITORY_URL"
  default_branch: "main"
  pull_request_action: "配置的-草稿拉取请求动作"
  pull_request_url_format: "由目标仓库平台返回并核实的规范拉取请求链接"
  draft_only: true

tracker:
  type: "linear"
  adapter_skill_name: "问题跟踪器适配技能占位值"
  team: "团队占位值"
  project: "项目占位值"
  labels:
    bug: "缺陷标签占位值"
    performance: "性能标签占位值"
    intake: "收件标签占位值"
    needs_repro: "需要复现标签占位值"
  status: "收件状态占位值"
  source_link_title: "Slack 报告"
  require_compensation_action: true

routing:
  map_path: ".agents/project/issue-automation/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  skill_name: "control-target-app"
  feature_map_path: ".agents/project/issue-automation/feature-map.md"
  environment: "安全测试环境占位值"
  artifact_directory: "/tmp/issue-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[issue:bug]"
  performance: "[issue:performance]"
  other: "[issue:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

models:
  triage: "选择一个实际可用的公开模型标识"
  reproduce: "选择一个实际可用的公开模型标识"
  code: "选择一个实际可用的公开模型标识"
  media_review: "选择一个实际可用的公开模型标识"
