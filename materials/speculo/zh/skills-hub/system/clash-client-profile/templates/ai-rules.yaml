# Mihomo/Clash 规则模式的广泛 AI 服务基线，并非完整允许列表。
# 将 🔰 节点选择 替换为已有代理组的准确名称，该组当前
# 叶子不能是 DIRECT；此处不要指向 DIRECT 或 REJECT。
# 在 Clash Verge Rev 的编辑规则 prepend 框中，只粘贴规则文本：去掉
# "prepend:"、开头的 "- " 和双引号。直接编辑配置的
# rules-extension YAML 时，原样使用本文件。
# 放在订阅自身规则之前；此处不要加入 MATCH 或 GEOIP。
# 共享登录、风控、功能开关和语音主机单独分组；
# 它们也承载其他站点流量，因此无法接受该取舍时，
# 移除该组。
# 有意省略仅遥测主机（Datadog、Sentry、Fathom、Qualtrics）。
# 有意不包含国内 AI 服务（deepseek.com、tongyi.aliyun.com、doubao.com、chatglm.cn）；
# 让它们继续使用订阅的直连／CN 路径。

